# Fantasy Command Center — league and pool declarations.
# Copy to config/leagues.yml and fill in. This file is safe to commit
# (no credentials) — those live in the encrypted secret store.

leagues:
  # --- ESPN pick'em (Stage 1 priority) --------------------------------
  # `challenge` is the slug in the URL when you make picks:
  #   fantasy.espn.com/games/nfl-pickem-2026/make-picks  ->  nfl-pickem-2026
  # Known kinds fcc can build for you: nfl_pickem, nfl_pigskin, college_pickem
  - key: espn_pickem
    platform: espn_pickem
    league_id: nfl-pickem-2026
    name: "ESPN NFL Pick'em"
    season: 2026
    extra:
      challenge: nfl-pickem-2026
      # Set true if your pool assigns 1..N confidence points per week.
      confidence_points: false
      # Staff picks page. `fcc pickem run` fetches this when no --picks-file
      # is given. Requires FantasyGuru credentials in the secret store.
      fantasyguru_url: https://www.fantasyguru.com/nfl-bets

  # --- Sleeper redraft ------------------------------------------------
  # league_id: the number in the URL - sleeper.com/leagues/<league_id>/team
  # team_id:   your Sleeper USER id, not your username and not a team id.
  #            Sleeper identifies your roster by its owner_id, which is the
  #            user id. Get it with:
  #              curl -s https://api.sleeper.app/v1/user/<your-username>
  #            and take the "user_id" field (an 18-digit string).
  - key: sleeper_main
    platform: sleeper
    league_id: "000000000000000000"
    name: "Main Sleeper League"
    season: 2026
    team_id: "000000000000000000"
    # redraft | guillotine | dynasty | bestball.
    # `guillotine` changes how FAAB is priced: budget never replenishes, the
    # field shrinks weekly, and `fcc faab bid` reports who can still outbid you.
    format: redraft
    # Waivers clear 3am Wednesday Eastern; the sniper arms just before this.
    waiver_clear_cron: "0 3 * * 3"

  # --- Yahoo ------------------------------------------------------------
  - key: yahoo_main
    platform: yahoo
    league_id: "449.l.000000"
    name: "Yahoo League"
    season: 2026

  # --- ESPN fantasy -----------------------------------------------------
  - key: espn_main
    platform: espn
    league_id: "000000"
    name: "ESPN League"
    season: 2026
    team_id: "1"
